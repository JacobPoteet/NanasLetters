name: CodeQL

# Static security analysis for the JS/TS in the Worker, React app, and
# shared/. Free on public repos; results land in the repo's Security -> Code
# scanning tab. Runs on push/PR to main and a weekly cron so newly disclosed
# query packs still catch code that hasn't changed.
#
# Must stay identical to ci.yml's paths-ignore -- see CLAUDE.md's CI/CD
# section. The weekly cron still re-scans everything regardless, so skipping
# here never leaves code permanently unanalyzed.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL analyzes JS/TS from source, and this repo's
      # build needs generated Cloudflare types + a placeholder .dev.vars that
      # add nothing to the analysis.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.1
